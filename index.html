<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{OFFER_HEADLINE_SHORT}} | {{SCHOOL_NAME}}</title>
  <!-- Meta Pixel Code -->

  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];

  <noscript><img height="1" width="1" style="display:none"

  /></noscript>

  <!-- GOOGLE ANALYTICS: INSERT GA4 ID HERE -->
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
      width: 100%;
    }

    /* ── HERO ── */
    .hero {
      background: #1a1a1a url('hero.jpg') center/cover no-repeat;
      position: relative;
      padding: 48px 0;
      text-align: center;
      width: 100%;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    .hero .wrap {
      position: relative;
      z-index: 1;
    }

    .school-name {
      color: #FFD700;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
      color: #fff;
    }

    .hero-sub {
      color: #bbb;
      font-size: 16px;
      margin-bottom: 26px;
    }

    /* ── LEAD FORM ── */
    .lead-form {
      background: #222;
      border-radius: 12px;
      padding: 20px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .fg {
      flex: 1;
    }

    .fg {
      margin-bottom: 12px;
    }

    .fg input {
      width: 100%;
      padding: 14px 14px;
      border-radius: 8px;
      border: 2px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    .fg input:focus { border-color: #FFD700; }
    .fg input.error { border-color: #ff4444 !important; }
    .fg input::placeholder { color: #555; }

    /* Phone */
    .phone-wrap {
      display: flex;
      border: 2px solid #333;
      border-radius: 8px;
      background: #1a1a1a;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .phone-wrap:focus-within { border-color: #FFD700; }
    .phone-wrap.error { border-color: #ff4444 !important; }

    .phone-flag {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      background: #252525;
      border-right: 1px solid #333;
      color: #ccc;
      font-size: 14px;
      white-space: nowrap;
      flex-shrink: 0;
      user-select: none;
    }

    .phone-flag span { font-size: 18px; }

    .phone-wrap input {
      flex: 1;
      padding: 14px 14px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      outline: none;
      min-width: 0;
      -webkit-appearance: none;
    }

    .phone-wrap input::placeholder { color: #555; }

    .phone-error {
      color: #ff6666;
      font-size: 12px;
      margin-top: 5px;
      text-align: left;
      display: none;
    }

    .phone-error.show { display: block; }

    /* SMS consent */
    .sms-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 16px;
      margin-top: 4px;
    }

    .sms-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      min-width: 18px;
      margin-top: 1px;
      accent-color: #FFD700;
      cursor: pointer;
    }

    .sms-row label {
      font-size: 12px;
      color: #888;
      line-height: 1.55;
      cursor: pointer;
    }

    .sms-row.error label { color: #ff8888; }

    .btn-cta {
      display: block;
      width: 100%;
      padding: 18px;
      background: #FFD700;
      color: #1a1a1a;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-cta:hover { background: #f5ce00; }
    .btn-cta:active { transform: scale(0.98); }

    .form-error {
      color: #ff6666;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    .form-error.show { display: block; }

    .address-line {
      color: #888;
      font-size: 13px;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ═══ HERO + FORM (only two elements: offer statement, form) ═══ -->
  <section class="hero" id="top">
    <div class="wrap">
      <p class="school-name">{{SCHOOL_NAME}}</p>
      <h1>{{OFFER_HEADLINE}}</h1>
      <p class="hero-sub">{{OFFER_SUBHEAD}}</p>

      <!-- Lead Form -->
      <form class="lead-form" id="lead-form" novalidate>
        <div class="fg">
          <input type="text" id="fullName" placeholder="Full Name" autocomplete="name" required>
        </div>
        <div class="fg">
          <div class="phone-wrap" id="phoneWrap">
            <div class="phone-flag"><span>{{PHONE_FLAG_EMOJI}}</span> {{PHONE_COUNTRY_CODE}}</div>
            <input type="tel" id="phone" placeholder="(555) 000-0000" autocomplete="tel" required>
          </div>
          <p class="phone-error" id="phoneError">Please enter a valid 10-digit phone number.</p>
        </div>
        <div class="sms-row" id="smsRow">
          <input type="checkbox" id="smsConsent">
          <label for="smsConsent">By providing your phone number, you agree to receive text messages from {{SCHOOL_NAME}}. Message and data rates may apply. Message frequency varies.</label>
        </div>
        <button type="submit" class="btn-cta">{{FORM_BUTTON_TEXT}}</button>
        <p class="form-error" id="formError">Please complete all fields and accept the SMS consent.</p>
      </form>

      <p class="address-line">📍 {{ADDRESS}}</p>
    </div>
  </section>

  <script>
    /* ── PHONE AUTO-FORMAT ── */
    document.getElementById('phone').addEventListener('input', function () {
      var digits = this.value.replace(/\D/g, '').slice(0, 10);
      var out = '';
      if (digits.length === 0) {
        out = '';
      } else if (digits.length <= 3) {
        out = '(' + digits;
      } else if (digits.length <= 6) {
        out = '(' + digits.slice(0, 3) + ') ' + digits.slice(3);
      } else {
        out = '(' + digits.slice(0, 3) + ') ' + digits.slice(3, 6) + '-' + digits.slice(6);
      }
      this.value = out;
      // clear error while user is typing
      document.getElementById('phoneWrap').classList.remove('error');
      document.getElementById('phoneError').classList.remove('show');
    });

    /* ── FORM VALIDATION & SUBMIT ── */
    document.getElementById('lead-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      var nm = document.getElementById('fullName');
      var ph = document.getElementById('phone');
      var pw = document.getElementById('phoneWrap');
      var pe = document.getElementById('phoneError');
      var sm = document.getElementById('smsConsent');
      var sr = document.getElementById('smsRow');
      var er = document.getElementById('formError');

      // reset
      nm.classList.remove('error');
      pw.classList.remove('error');
      pe.classList.remove('show');
      sr.classList.remove('error');
      er.classList.remove('show');

      var ok = true;

      if (!nm.value.trim()) { nm.classList.add('error'); ok = false; }

      var phoneDigits = ph.value.replace(/\D/g, '');
      if (phoneDigits.length !== 10) {
        pw.classList.add('error');
        pe.classList.add('show');
        ok = false;
      }

      if (!sm.checked) { sr.classList.add('error'); ok = false; }

      if (!ok) {
        if (!nm.value.trim() || !sm.checked) {
          er.classList.add('show');
        }
        return;
      }

      // Split "Full Name" into first/last — book.html's calendar prefill and
      // the webhook payload both still expect separate first_name/last_name.
      var nameParts = nm.value.trim().split(/\s+/);
      var firstName = nameParts[0] || '';
      var lastName  = nameParts.slice(1).join(' ') || '';

      sessionStorage.setItem('leadData', JSON.stringify({
        firstName: firstName,
        lastName:  lastName,
        phone:     phoneDigits
      }));

      try {
        await fetch('{{TRIAL_WEBHOOK_URL}}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            first_name: firstName,
            last_name:  lastName,
            phone:      phoneDigits,
            source:     '{{SCHOOL_NAME}} Landing Page'
          })
        });
      } catch (e) {}

      window.location.href = 'book.html';
    });
  </script>
</body>
</html>
